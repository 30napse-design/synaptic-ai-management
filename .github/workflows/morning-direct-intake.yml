name: Morning direct-intake smoke
on:
  push:
    branches:
      - feature/morning-direct-intake-2026-11-24
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/morning-direct-intake.test.mjs tests/standalone-sample-intake.test.mjs tests/operational-intake-engines-integration.test.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
