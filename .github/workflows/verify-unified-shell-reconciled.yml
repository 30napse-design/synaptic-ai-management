name: Verify RTL shared workspace shell phase one
on:
  push:
    branches:
      - test/unified-shell-phase1-reconciled-2026-11-23
  pull_request:
    branches:
      - hostinger-nextjs-fix
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/unified-workspace-shell-reconciled.test.mjs tests/navigation.test.mjs tests/unified-work-dashboard.test.mjs tests/login-home-ui-regression.test.mjs tests/morning-direct-hostinger-regression.test.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
