name: Verify Hostinger profile image upload
on:
  push:
    branches: [fix/profile-avatar-hostinger-2026-11-23]
  pull_request:
    branches: [hostinger-nextjs-fix]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/profile-avatar-hostinger.test.mjs tests/account-profile-sample-regression.test.mjs tests/navigation.test.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
