name: Verify morning direct intake on Hostinger
on:
  push:
    branches: [test/morning-direct-intake-hostinger-2026-11-24]
  pull_request:
    branches: [hostinger-nextjs-fix]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/morning-direct-hostinger-regression.test.mjs tests/operational-intake-reconcile.test.mjs tests/standalone-sample-intake.test.mjs tests/ticket-dashboard.test.mjs tests/navigation.test.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
