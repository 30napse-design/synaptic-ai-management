name: Verify TKT-01 taxonomy without deployment
on:
  pull_request:
    branches: [hostinger-nextjs-fix]
    paths:
      - 'lib/unified-intake-taxonomy.ts'
      - 'lib/unified-intake-routing.ts'
      - 'lib/ticket-support-taxonomy.ts'
      - 'lib/operations-filter-classification.ts'
      - 'tests/ticket-support-taxonomy.test.mjs'
      - '.github/workflows/verify-tkt-01.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/ticket-support-taxonomy.test.mjs tests/unified-intake-routing.test.mjs tests/ticket-support-policy.test.mjs tests/intake-policy.test.mjs tests/operations-filter-postgres.test.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
