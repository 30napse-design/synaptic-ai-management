name: Verify SYNAPSE visual work dashboard
on:
  push:
    branches:
      - test/work-dashboard-pixel-hostinger-2026-11-23
  pull_request:
    branches:
      - hostinger-nextjs-fix
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/unified-work-dashboard.test.mjs tests/navigation.test.mjs tests/ticket-dashboard.test.mjs tests/standalone-sample-intake.test.mjs tests/account-profile-sample-regression.test.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
