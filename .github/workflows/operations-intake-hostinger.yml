name: Verify operations intake wireframe integration
on:
  push:
    branches:
      - feature/operations-intake-hostinger-2026-11-23
      - fix/operational-intake-engines-2026-11-23
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/operations-intake-ui.test.mjs tests/ticket-support-taxonomy.test.mjs tests/intake-policy.test.mjs tests/navigation.test.mjs tests/standalone-sample-intake.test.mjs tests/operational-intake-engines-integration.test.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
