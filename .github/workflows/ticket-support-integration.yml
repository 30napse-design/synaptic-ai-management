name: Validate ticket support integration
on:
  push:
    branches:
      - feature/ticket-support-integrated-hostinger-2026-11-23
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/ticket-support-taxonomy.test.mjs tests/ticket-support-policy.test.mjs tests/intake-policy.test.mjs tests/navigation.test.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
