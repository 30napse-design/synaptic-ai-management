name: Verify sample intake and header integration
on:
  push:
    branches:
      - test/sample-intake-header-operations-hostinger-2026-11-23
  pull_request:
    branches:
      - hostinger-nextjs-fix
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/sample-intake-ux-regression.test.mjs tests/ticket-dashboard.test.mjs tests/navigation.test.mjs tests/ticket-support-policy.test.mjs tests/operations-intake-ui.test.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
