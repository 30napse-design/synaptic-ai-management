name: Verify Hostinger operations read resilience
on:
  push:
    branches: [fix/hostinger-operations-read-resilience-2026-11-24]
  pull_request:
    paths:
      - 'lib/operations-data.ts'
      - 'lib/operations-filter-classification.ts'
      - 'lib/operations-date-filter.ts'
      - 'runtime/postgres-sql.mjs'
      - 'tests/operations-filter-postgres.test.mjs'
      - 'tests/operations-received-date.test.mjs'
      - 'app/api/operations/route.ts'
      - 'app/(workspace)/operations/page.tsx'
      - 'tests/dispatch-read-availability.test.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/dispatch-read-availability.test.mjs tests/unified-intake-routing.test.mjs tests/navigation.test.mjs tests/operations-filter-postgres.test.mjs tests/operations-received-date.test.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
