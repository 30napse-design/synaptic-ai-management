name: Verify TKT-02 V3 workdesk without deployment
on:
  pull_request:
    branches: [hostinger-nextjs-fix]
    paths:
      - 'components/operations/ticket-v3-controls.tsx'
      - 'components/operations/ticket-dashboard.css'
      - 'app/operations/operations-app.tsx'
      - 'lib/operations-data.ts'
      - 'tests/ticket-v3-workdesk.test.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/ticket-v3-workdesk.test.mjs tests/ticket-dashboard.test.mjs tests/ticket-compact-final.test.mjs tests/ticket-source-role-reconcile.test.mjs tests/ticket-support-taxonomy.test.mjs tests/unified-intake-routing.test.mjs tests/operations-filter-postgres.test.mjs tests/operations-received-date.test.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
