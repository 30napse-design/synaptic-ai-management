name: Verify unified intake routing without deployment
on:
  push:
    branches: [feature/unified-intake-routing-implementation-2026-11-24]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/unified-intake-routing.test.mjs tests/navigation.test.mjs tests/login-home-ui-regression.test.mjs tests/unified-workspace-shell-reconciled.test.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
